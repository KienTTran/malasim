allele_patterns:
  # ART resistance marker:
  # match any genotype with Pfkelch13 580Y.
  # Position 34 in the genotype string corresponds to kelch13 amino acid 580.
  ART: '^.{34}Y.*$'

  # PPQ resistance marker:
  # match any genotype with plasmepsin copy number = 2.
  # The genotype string ends with "|1" or "|2", where the last value is plasmepsin copy number.
  PPQ: '.*\|2$'

  # LUM-associated marker:
  # match the combined haplotype Pfcrt K76 + Pfmdr1 N86 + Pfmdr1 184F.
  # In the genotype string:
  # - position 4 = Pfmdr1 86  -> N
  # - position 5 = Pfmdr1 184 -> F
  # - position 9 = Pfcrt 76   -> K
  # This regex matches the KNF combination only (not any single marker alone).
  LUM: '^.{4}NF.{3}K.*$'

  # AMQ-associated marker:
  # match the combined haplotype Pfcrt 76T + Pfmdr1 86Y + Pfmdr1 184Y.
  # In the genotype string:
  # - position 4 = Pfmdr1 86  -> Y
  # - position 5 = Pfmdr1 184 -> Y
  # - position 9 = Pfcrt 76   -> T
  # This regex matches the TYY combination only (not any single marker alone).
  AMQ: '^.{4}YY.{3}T.*$'
  
